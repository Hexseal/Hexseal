# Что этот файл делает на самом деле:
#   1. гоняет тесты и гейты контрактов, фронта и релеера на каждый пуш в main;
#   2. собирает докер-образы и кладёт их в ghcr.
# Выкатки здесь НЕТ по умолчанию. Задание deploy срабатывает только при ручном
# запуске из вкладки Actions с галочкой «Deploy to VPS after build?».
# Обычная выкатка владельца идёт мимо GitHub — скриптом deploy-local.sh.
# Файл назывался deploy.yml и вводил в заблуждение именно этим.
name: CI · образы · выкатка только вручную

on:
  push:
    branches: [main]
  # Без этого триггера у чужого PR не было бы НИ ОДНОЙ проверки: репозиторий
  # открыт, значит первая правка со стороны приезжает именно так, а не пушем в
  # main. Гоняются оба job'а с тестами (`contracts` и `web`); публикация образов
  # (`build`) на PR намеренно пропускается — см. `if:` у неё.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to VPS after build?'
        type: boolean
        default: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # С 15 августа 2026 `lib/` — не файлы в репозитории, а два подмодуля
      # (forge-std и openzeppelin-contracts), у OZ ещё три своих вложенных.
      #
      # ⚠️ Честно про эту строку: она НЕ гейт. Замер (снять строку — сколько
      # красных): `git submodule deinit -f --all` и потом `forge build` —
      # **ноль красных, экзит 0**. Forge видит пустой `lib/`, сам печатает
      # «Missing dependencies found. Installing now...» и доустанавливает —
      # рекурсивно и ровно на записанные пины, remappings выходят те же.
      # То есть сборка починилась бы и без нас.
      #
      # Строка стоит, потому что: (1) делает зависимость явной в самом
      # checkout, а не побочным действием сборки; (2) снимает завязку на
      # недокументированное самолечение forge, которое версией может уехать;
      # (3) вытаскивает скачивание из шага сборки, где оно мерялось бы как
      # время компиляции. Убирать не надо, но и считать защитой — тоже.
      #
      # Про глубину подмодулей это было проверено, а не предположено: пины —
      # коммиты мастера годичной давности (docs/OPEN-ITEMS.md, п. 59), и был
      # вопрос, дотянется ли до них мелкий фетч. Замер: `git fetch --depth 1
      # origin <пин>` для обоих репозиториев проходит, GitHub отдаёт коммит по
      # хешу. То есть подмодулям мелкой глубины хватало.
      #
      # ⚠️ `fetch-depth: 0` стоит здесь РАДИ ДЕСЯТОГО ГЕЙТА и больше ни для
      # чего. Он сравнивает docs/OPEN-ITEMS.md на двух концах диапазона правки,
      # а при глубине по умолчанию (один коммит) второго конца в клоне просто
      # нет: гейт вернул бы 3 («проверить не удалось») на каждом запуске.
      # Убрать эту строку — значит выключить его молча, поэтому она с
      # объяснением, а не сама по себе.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0

      # ⚠️ НЕ УДАЛЯТЬ. Slither здесь нужен не сам по себе — его зовут ДВА гейта
      # раскладки хранилища: script/check-storage-layout.sh:50 и
      # script/check-agreement-layout.sh, оба через `slither . --print
      # variable-order`. Отдельного шага `slither .` в этом файле нет и не
      # должно быть, поэтому установка выглядит осиротевшей — и 2 августа была
      # снесена именно по этой причине, после проверки одного лишь workflow.
      # Оба гейта тут же упали с кодом 127, job contracts покраснел, а вместе с
      # ним встала и публикация образов: build ждёт contracts.
      # Прежде чем трогать — грепнуть `slither` по script/, а не по этому файлу.
      - name: Install slither (нужен гейтам раскладки хранилища)
        run: pip install --break-system-packages slither-analyzer

      - name: Run contract tests
        run: forge test

      - name: Check Diamond storage layout
        run: ./script/check-storage-layout.sh

      - name: Check Diamond storage struct fields
        run: ./script/check-storage-structs.sh

      - name: Check Agreement storage layout
        run: ./script/check-agreement-layout.sh

      - name: Check ERC-2771 sender rule (no raw msg.sender in gasless contracts)
        run: ./script/check-gasless-sender.sh

      - name: Check appeal window (relayer copy matches contract)
        run: ./script/check-appeal-window.sh

      # ── The seventh and eighth gates, added 21 August 2026 ─────────────────
      #
      # Both carried "NOT WIRED INTO CI, deliberately" in their own headers,
      # on one argument: six gates already run and each new one is a tax on
      # every push. The argument was never measured, and the second gate below
      # is what made measuring it urgent — it exists to catch a thing being
      # FORGOTTEN, and it was itself remembered only by hand.
      #
      # Measured on a warm cache, which is what CI has here because `forge test`
      # above has already built: 1.4 s for the bond writers, 3.1 s for the
      # subgraph events. Their own `forge build` is a cache hit, not a rebuild.
      # Against a job that installs Foundry, pip-installs slither and runs 959
      # tests, the tax is under five seconds.
      #
      # No new dependency either: both need python3, which check-gasless-sender
      # above has been proving present since it was added.
      - name: Check arbiter bond writers (exactly one non-zero writer)
        run: ./script/check-arbiter-bond-writers.sh

      - name: Check subgraph arbiter events (coverage, liveness, mistake paths)
        run: ./script/check-subgraph-arbiter-events.sh

      # Версия каждой зависимости объявлена трижды: гитлинком, строкой в
      # foundry.lock и тем, что реально выложено на диск. Гейт сверяет все три.
      # Замер (порча + прогон): чужой коммит в локе, пропавшая строка, лишняя
      # строка, подмодуль уведён на чужой коммит — четыре красных из четырёх,
      # честное состояние зелёное. Четвёртая порча найдена не выдумкой, а
      # оборвавшимся клоном: см. шапку самого скрипта.
      - name: Check submodule pins (git vs foundry.lock)
        run: ./script/check-submodule-pins.sh

      # ── The ninth gate, added 21 August 2026 ──────────────────────────────
      #
      # The repository is public since 14 August; the design specs and the
      # working notes are not, and nothing stopped a comment from pointing into
      # them. By 21 August eight tracked files did — a dead link for every
      # reader, and a disclosure of the date and subject of a document nobody
      # outside is going to get.
      #
      # It belongs in CI rather than in a habit, because the two sweeps done by
      # hand before it BOTH found some of the references and missed the rest.
      # One of the misses is why this gate does not read physical lines: the
      # reference in relayer/bagStore.js was wrapped across a line break, so
      # every grep for the directory came back clean while the pointer stayed
      # perfectly readable.
      #
      # Measured, three consecutive runs: 0.85 s, 0.85 s, 0.84 s. It reads the
      # 692 tracked files and needs no build, no node_modules and no network,
      # so unlike the eight gates above it does not even depend on the warm
      # cache — it would hold on a bare checkout with the submodules missing.
      # python3 is already proven present by the gates above.
      - name: Check internal refs (nothing tracked points at withheld material)
        run: ./script/check-internal-refs.sh

      # ── The tenth gate, added 22 August 2026 ──────────────────────────────
      #
      # docs/DECISIONS.md появился в этот день. До него довод «почему решили
      # так» жил только там, откуда его никто снаружи не достанет, и читателю
      # публичного репозитория оставались коммиты — запись работы, а не запись
      # смысла. За неделю, когда снос арбитра становился состязательным
      # процессом, в коммитах было больше всего тестов, гейтов и сборки.
      #
      # Гейт узкий нарочно: он краснеет не на всякой правке списка долгов, а
      # только на той, что помечает пункт закрытым, — это и есть момент, когда
      # выбор сделан и его есть что записать.
      #
      # Сравнивается ДИФ, а не состояние: пункт, который не был закрыт на одном
      # конце диапазона и закрыт на другом. Поэтому перенос или переименование
      # уже закрытого пункта гейт не будит, хотя строка с пометкой в дифе есть.
      # Диапазон в CI берётся из события (push — before..after, PR — base..head)
      # и печатается первой строкой; отсюда же `fetch-depth: 0` в checkout выше.
      #
      # Замеры (стенд — отдельный репозиторий с копией обоих файлов; названы
      # сцены, а не только числа):
      #   пометка закрытия без правки журнала     → красный, с именем пункта
      #   она же плюс строка в журнале            → зелёный
      #   пометка словом СНЯТ / зачёркиванием     → красный (не одно написание)
      #   «НЕ ЗАКРЫТ» в заголовке                 → зелёный (отрицание не метка)
      #   переименование уже закрытого пункта     → зелёный
      #   правка прозы внутри пункта              → зелёный
      # Порча самого гейта: словарь сведён к одному написанию — молчат сцены
      # СНЯТ и зачёркивание; снят запрет отрицания — краснеет сцена «НЕ ЗАКРЫТ»;
      # «журнал тронут» подменено на «журнал существует» — гейт зеленеет на всех
      # трёх сценах закрытия; диф подменён состоянием — краснеют все три сцены,
      # которые обязаны молчать.
      #
      # Измерено на этом репозитории, три запуска подряд: 0.05 s, 0.05 s,
      # 0.05 s. Ни сборки, ни node_modules, ни сети — только `git show` по двум
      # файлам. python3 уже доказан присутствующим гейтами выше.
      - name: Check decisions log (a closed item comes with a decision)
        run: ./script/check-decisions-log.sh

  # Симметрия к `contracts`: у фронта и релеера тесты были написаны и зелены,
  # но не запускались нигде — то есть памяти о поломках у них не было вовсе.
  # Всё, что здесь перечислено, уже существует в репозитории; job ничего не
  # изобретает, только поднимает это на каждый пуш.
  #
  # `npm run lint` СЮДА НЕ ДОБАВЛЯТЬ: он сломан целиком (OPEN-ITEMS #18,
  # eslint ^9 vs @typescript-eslint ^7 vs eslint-config-next 15.5.15) — это
  # отдельная работа. Его частичную замену держит шаг «hooks rule gate» ниже.
  #
  # `relayer/e2e.mjs` СЮДА НЕ ДОБАВЛЯТЬ НИКОГДА: он ходит в живую Base Sepolia
  # и тратит реальный тестовый USDC — в CI это трата денег на каждый пуш.
  web:
    name: frontend & relayer
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # ─── TWO NODE VERSIONS IN THIS JOB, ON PURPOSE ─────────────────────────
      #
      # node 22 — the SHIPPED runtime. Both images are `node:22-alpine`
      #   (relayer/Dockerfile, frontend/Dockerfile), so the relayer tests, the
      #   `next build` and the type-check keep running on the same major that
      #   actually serves traffic. Pinned in `/.nvmrc`.
      #
      # node 24 — the BROWSER STAND-IN. Used by the `Frontend tests` step and by
      #   nothing else. Pinned in `/frontend/.nvmrc`.
      #
      # Why the frontend tests cannot run on 22: several stands measure two
      # browser TABS contending for one lock, and they do it with the real
      # `navigator.locks` (Web Locks), which is process-wide — exactly what it
      # is for two tabs of one origin. Node ships it from v24 on; node 22 has a
      # `navigator`, but no `.locks` on it at all:
      #
      #     node v22.23.2 -> typeof globalThis.navigator.locks === 'undefined'
      #     node v24.12.0 -> typeof globalThis.navigator.locks === 'object'
      #
      # Faking the lock is not an option: a fake would make those stands measure
      # themselves instead of the production code. So on node 22 those thirteen
      # tests were not checking behaviour, they were checking the absence of a
      # browser API — and they said so with a scatter of `expected 1 to be 2`
      # that named no cause. That is what kept this workflow red for eighteen
      # consecutive runs, 15-20 August 2026.
      #
      # Both versions are READ FROM `.nvmrc` FILES rather than written here, so
      # a developer's `nvm use` and this workflow cannot drift apart in silence.
      # Silence is precisely how the gap survived: `.nvmrc` did not exist and no
      # `engines` was set, so nothing in the repository ever stated which node
      # the frontend suite needs, and the difference was invisible from both
      # ends. Change the version in the file, not in this workflow.
      #
      # `frontend/src/lib/__stand__/requireWebLocks.ts` is the backstop for the
      # case where someone runs the suite on the wrong node anyway: the affected
      # stands refuse to run and name the reason once, instead of failing
      # thirteen times without naming it at all.
      # ───────────────────────────────────────────────────────────────────────
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            relayer/package-lock.json
            frontend/package-lock.json

      # ПОРЯДОК ШАГОВ ЗНАЧИМ. Релеерные зависимости нужны не только релееру:
      # у фронта нет своего тест-раннера, и `npm test` во frontend/ запускает
      # `node ../relayer/node_modules/vitest/vitest.mjs run` (почему именно так
      # — шапка frontend/vitest.config.mjs). Переставишь эти два шага местами
      # или выкинешь установку релеера — фронтовые тесты упадут на
      # «Cannot find module .../vitest.mjs», а не на настоящей ошибке.
      - name: Install relayer deps
        working-directory: relayer
        run: npm ci

      # --legacy-peer-deps — ровно как в frontend/Dockerfile. Без флага `npm ci`
      # падает на ERESOLVE: eslint ^9 против peer eslint ^8.56 у
      # @typescript-eslint/eslint-plugin ^7. Это тот же конфликт, из-за которого
      # сломан `npm run lint` (OPEN-ITEMS #18).
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Relayer tests
        working-directory: relayer
        run: npm test

      # Switch to the browser stand-in, for the frontend suite and nothing else
      # — reasons in the block above the first `setup-node`. No `cache:` key
      # here on purpose: the npm cache was already restored by that first step
      # and will be saved by it; asking a second time only earns duplicate-key
      # warnings. This step swaps the node binary, nothing more.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      # Back to the shipped runtime immediately. Every step below this line
      # builds or checks what the Docker images will actually run, so it has to
      # be measured on the major they use (node:22-alpine), not on the stand-in.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Гейт правила хуков — единственная часть линта, которая в этом репозитории
      # вообще работает. Конфиг грузит только eslint-plugin-react-hooks:
      # rules-of-hooks = error, exhaustive-deps = warn. Значит шаг краснеет на
      # настоящем нарушении порядка хуков (хук после раннего return, хук в
      # условии), а не на накопленном шуме зависимостей.
      - name: Hooks rule gate
        working-directory: frontend
        run: node node_modules/eslint/bin/eslint.js -c eslint.hooks.mjs "src/**/*.{ts,tsx,js,jsx}"

      # `next build` — единственное, что ловит требование Suspense вокруг
      # useSearchParams(): оно проверяется постранично, при пререндере, и не
      # видно ни в `next dev`, ни в tsc. В этом проекте оно уже роняло ветку.
      #
      # Адреса — фиксированные заглушки, теми же значениями, что в
      # frontend/vitest.config.mjs. Они обязаны быть: config/contracts.ts
      # намеренно бросает НА ЗАГРУЗКЕ МОДУЛЯ, если их нет (без хардкод-фолбэка —
      # однажды устаревший literal молча перебил исправленный адрес). Сборке
      # при этом всё равно, какие именно; настоящие адреса приезжают из secrets
      # в job `build` ниже, который и собирает образ для выкатки.
      - name: Frontend build
        working-directory: frontend
        env:
          NEXT_PUBLIC_DIAMOND_ADDRESS: '0x0000000000000000000000000000000000000d1a'
          NEXT_PUBLIC_FORWARDER_ADDRESS: '0x000000000000000000000000000000000000f0Fd'
          NEXT_PUBLIC_USDC_ADDRESS: '0x0000000000000000000000000000000000005dc0'
        run: npm run build

      # Полный проход tsc по программе tsconfig — шире, чем типы, до которых
      # дотягивается сборка. После build намеренно: к этому моменту существует
      # .next/types, который tsconfig включает в программу.
      # Только `npm run type-check`; голый `npx tsc` в этом репозитории врёт
      # (node_modules/.bin пуст на exFAT — там он возвращает 0, ничего не проверив).
      - name: Frontend type-check
        working-directory: frontend
        run: npm run type-check

  # ─── СОБИРАЕМ, НО НЕ ПУБЛИКУЕМ (решение владельца, 20 августа 2026) ───────
  #
  # Этот job строит оба образа и выбрасывает их. Сборка остаётся, и это не
  # обряд: она ЕДИНСТВЕННОЕ место, где вообще проверяются оба Dockerfile.
  # Сломанный `frontend/Dockerfile` иначе обнаружился бы только на выкатке,
  # руками, в самый неподходящий момент.
  #
  # Публикация в ghcr убрана, и довод не технический. Выкатка через реестр
  # однажды подсунула владельцу не ту сборку: собиралось не из той ветки, и
  # время ушло на поиск причины. Такое лечится ОТСУТСТВИЕМ МЕХАНИЗМА, а не
  # доверием к нему.
  #
  # Второй довод, проверенный до решения: реестр сегодня НЕ КОРМИТ НИЧЕГО.
  # `deploy-local.sh` собирает образ локально, переливает его на сервер через
  # `docker save | ssh docker load` и только ПЕРЕИМЕНОВЫВАЕТ его в
  # `ghcr.io/hexseal/*:latest` (строки 117, 125, 166) — чтобы
  # `docker-compose.yml` нашёл его по этому имени. Из ghcr.io не тянет никто.
  #
  # Третий: прав всё равно нет. Прогон 32383937504 (20 августа) — `denied:
  # permission_denied: read_package`. Сборка там прошла целиком, упала ровно
  # отправка, и красным был именно этот шаг.
  #
  # ⚠️ ВЕРНУТЬ ПУБЛИКАЦИЮ — ОДНА СТРОКА ПЛЮС ВЫДАЧА ПРАВ. Строка: `push: false`
  # → `push: true` в обоих шагах ниже. Права: вернуть шаг «Login to GHCR» и
  # `packages: write` в `permissions`, и выдать пакетам `hexseal/relayer` и
  # `hexseal/frontend` доступ ЭТОГО репозитория с правом записи (Packages →
  # Package settings → Manage Actions access) — без этого `GITHUB_TOKEN` с
  # `packages: write` всё равно получит `read_package`, что и произошло.
  # Подробности и порядок — docs/OPEN-ITEMS.md, пункт 100.
  #
  # `if:` СОХРАНЁН, но причина у него теперь ДРУГАЯ, и старую нельзя оставлять
  # написанной: она перестала быть правдой. Прежняя — «у форка нет
  # `packages: write`, шаг входа в реестр упал бы» — исчезла вместе с
  # публикацией. Новая: `frontend` собирается с `build-args` из секретов, а PR
  # из форка получает их пустыми, и `config/contracts.ts` бросает на загрузке
  # модуля. Сторонний участник увидел бы красный CI за то, чего не делал.
  # Триггер остаётся `pull_request`, а не `pull_request_target`: код форка не
  # должен видеть секреты. Менять нельзя.
  # ──────────────────────────────────────────────────────────────────────────
  build:
    needs: [contracts, web]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `packages: write` убран вместе с отправкой. Пока его нет, ни один шаг
      # этого job'а не может записать в реестр даже по ошибке.

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Шага «Login to GitHub Container Registry» здесь больше нет: он был
      # нужен только для отправки. Публиковать нечего — значит и входить некуда.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # `tags:` оставлены намеренно, хотя при `push: false` образ никуда не
      # уезжает. Они называют то, чем образ БЫЛ БЫ, и держат возврат к
      # публикации однострочным. Кэш `type=gha` работает без реестра.
      - name: Build relayer image (built, not published)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./relayer
          push: false
          tags: ghcr.io/hexseal/relayer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (built, not published)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          push: false
          tags: ghcr.io/hexseal/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_RELAYER_URL=${{ secrets.NEXT_PUBLIC_RELAYER_URL }}
            NEXT_PUBLIC_DIAMOND_ADDRESS=${{ secrets.NEXT_PUBLIC_DIAMOND_ADDRESS }}
            NEXT_PUBLIC_FORWARDER_ADDRESS=${{ secrets.NEXT_PUBLIC_FORWARDER_ADDRESS }}
            NEXT_PUBLIC_USDC_ADDRESS=${{ secrets.NEXT_PUBLIC_USDC_ADDRESS }}
            NEXT_PUBLIC_JOB_RECEIPT_ADDRESS=${{ secrets.NEXT_PUBLIC_JOB_RECEIPT_ADDRESS }}
            NEXT_PUBLIC_CHAIN_ID=${{ secrets.NEXT_PUBLIC_CHAIN_ID }}
            NEXT_PUBLIC_BASE_SEPOLIA_RPC_URL=${{ secrets.NEXT_PUBLIC_BASE_SEPOLIA_RPC_URL }}
            NEXT_PUBLIC_RPC_URL=${{ secrets.NEXT_PUBLIC_RPC_URL }}
            NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            NEXT_PUBLIC_IPFS_GATEWAY=${{ secrets.NEXT_PUBLIC_IPFS_GATEWAY }}
            SUBGRAPH_URL=${{ secrets.SUBGRAPH_URL }}

  # ⚠️ ЭТА КНОПКА ОБЕЗВРЕЖЕНА — И ЭТО САМОЕ ВАЖНОЕ МЕСТО ФАЙЛА.
  #
  # Мина была такая. Пока `build` публиковал образы, `deploy` их оттуда тянул.
  # Если убрать публикацию и оставить выкатку как была, кнопка бы НЕ сломалась
  # — она бы продолжила работать и поставила на VPS ПОСЛЕДНИЙ УДАЧНО ЗАЛИТЫЙ
  # образ: неизвестной давности, собранный неизвестно из какого коммита, никак
  # не связанный с тем, что стоит в репозитории сейчас. То есть ровно тот
  # случай, ради которого публикацию и убрали, только теперь гарантированный.
  #
  # Поэтому здесь не осталось НИ ОДНОГО шага, умеющего ходить наружу: нет
  # `appleboy/ssh-action`, нет `docker login`, нет `docker compose pull`, нет
  # обращения к `secrets.GHCR_TOKEN` и `secrets.VPS_SSH_KEY`. Нажать и получить
  # старый образ нечем — не потому, что что-то это запрещает, а потому, что
  # тянуть образ физически некому.
  #
  # Job при этом НЕ «пропускается» молча: молчаливый пропуск оставил бы
  # нажавшего в уверенности, что выкатка прошла. Он падает названной строкой.
  #
  # ⚠️ УБРАНО, А НЕ ОТМЕНЕНО НАВСЕГДА. Владелец не против реестра в принципе —
  # он против него сегодня. Прежний шаг (ssh-action + `docker login ghcr.io`
  # секретом `GHCR_TOKEN` + `docker compose pull frontend relayer`) цел в
  # истории: `git show 1c2fe41f:.github/workflows/ci.yml`. Что нужно сделать,
  # чтобы вернуть кнопку, перечислено в docs/OPEN-ITEMS.md, пункт 100.
  deploy:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Refuse — image publishing is off, so there is nothing to deploy
        run: |
          echo "Deploying from the registry is switched off, on purpose."
          echo
          echo "The build job above builds both images but no longer pushes them, so"
          echo "ghcr.io/hexseal/relayer:latest and ghcr.io/hexseal/frontend:latest are"
          echo "NOT a picture of this commit. The newest tag in the registry is whatever"
          echo "last uploaded successfully, of unknown age and unknown branch. Pulling it"
          echo "would put an unknown build on the VPS -- which is the exact accident this"
          echo "was switched off to prevent: a registry deploy once served an image built"
          echo "from a different branch, and the time went into finding out why."
          echo
          echo "Deploy with ./deploy-local.sh instead. It builds the images locally,"
          echo "streams them to the VPS over SSH, and never touches ghcr.io."
          echo
          echo "To bring this button back: docs/OPEN-ITEMS.md, item 100."
          echo "::error title=Deploy is switched off::Image publishing is off, so there is no image to deploy from. Use ./deploy-local.sh. To restore: docs/OPEN-ITEMS.md item 100."
          exit 1
