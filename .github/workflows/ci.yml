# Что этот файл делает на самом деле:
#   1. гоняет тесты и гейты контрактов, фронта и релеера на каждый пуш в main;
#   2. собирает докер-образы и кладёт их в ghcr.
# Выкатки здесь НЕТ по умолчанию. Задание deploy срабатывает только при ручном
# запуске из вкладки Actions с галочкой «Deploy to VPS after build?».
# Обычная выкатка владельца идёт мимо GitHub — скриптом deploy-local.sh.
# Файл назывался deploy.yml и вводил в заблуждение именно этим.
name: CI · образы · выкатка только вручную

on:
  push:
    branches: [main]
  # Без этого триггера у чужого PR не было бы НИ ОДНОЙ проверки: репозиторий
  # открыт, значит первая правка со стороны приезжает именно так, а не пушем в
  # main. Гоняются оба job'а с тестами (`contracts` и `web`); публикация образов
  # (`build`) на PR намеренно пропускается — см. `if:` у неё.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to VPS after build?'
        type: boolean
        default: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # С 15 августа 2026 `lib/` — не файлы в репозитории, а два подмодуля
      # (forge-std и openzeppelin-contracts), у OZ ещё три своих вложенных.
      #
      # ⚠️ Честно про эту строку: она НЕ гейт. Замер (снять строку — сколько
      # красных): `git submodule deinit -f --all` и потом `forge build` —
      # **ноль красных, экзит 0**. Forge видит пустой `lib/`, сам печатает
      # «Missing dependencies found. Installing now...» и доустанавливает —
      # рекурсивно и ровно на записанные пины, remappings выходят те же.
      # То есть сборка починилась бы и без нас.
      #
      # Строка стоит, потому что: (1) делает зависимость явной в самом
      # checkout, а не побочным действием сборки; (2) снимает завязку на
      # недокументированное самолечение forge, которое версией может уехать;
      # (3) вытаскивает скачивание из шага сборки, где оно мерялось бы как
      # время компиляции. Убирать не надо, но и считать защитой — тоже.
      #
      # fetch-depth оставлен по умолчанию, и это проверено, а не предположено:
      # пины — коммиты мастера годичной давности (docs/OPEN-ITEMS.md, п. 59),
      # и был вопрос, дотянется ли до них мелкий фетч. Замер: `git fetch
      # --depth 1 origin <пин>` для обоих репозиториев проходит, GitHub отдаёт
      # коммит по хешу. Мелкая глубина безопасна.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0

      # ⚠️ НЕ УДАЛЯТЬ. Slither здесь нужен не сам по себе — его зовут ДВА гейта
      # раскладки хранилища: script/check-storage-layout.sh:50 и
      # script/check-agreement-layout.sh, оба через `slither . --print
      # variable-order`. Отдельного шага `slither .` в этом файле нет и не
      # должно быть, поэтому установка выглядит осиротевшей — и 2 августа была
      # снесена именно по этой причине, после проверки одного лишь workflow.
      # Оба гейта тут же упали с кодом 127, job contracts покраснел, а вместе с
      # ним встала и публикация образов: build ждёт contracts.
      # Прежде чем трогать — грепнуть `slither` по script/, а не по этому файлу.
      - name: Install slither (нужен гейтам раскладки хранилища)
        run: pip install --break-system-packages slither-analyzer

      - name: Run contract tests
        run: forge test

      - name: Check Diamond storage layout
        run: ./script/check-storage-layout.sh

      - name: Check Diamond storage struct fields
        run: ./script/check-storage-structs.sh

      - name: Check Agreement storage layout
        run: ./script/check-agreement-layout.sh

      - name: Check ERC-2771 sender rule (no raw msg.sender in gasless contracts)
        run: ./script/check-gasless-sender.sh

      - name: Check appeal window (relayer copy matches contract)
        run: ./script/check-appeal-window.sh

      # Версия каждой зависимости объявлена трижды: гитлинком, строкой в
      # foundry.lock и тем, что реально выложено на диск. Гейт сверяет все три.
      # Замер (порча + прогон): чужой коммит в локе, пропавшая строка, лишняя
      # строка, подмодуль уведён на чужой коммит — четыре красных из четырёх,
      # честное состояние зелёное. Четвёртая порча найдена не выдумкой, а
      # оборвавшимся клоном: см. шапку самого скрипта.
      - name: Check submodule pins (git vs foundry.lock)
        run: ./script/check-submodule-pins.sh

  # Симметрия к `contracts`: у фронта и релеера тесты были написаны и зелены,
  # но не запускались нигде — то есть памяти о поломках у них не было вовсе.
  # Всё, что здесь перечислено, уже существует в репозитории; job ничего не
  # изобретает, только поднимает это на каждый пуш.
  #
  # `npm run lint` СЮДА НЕ ДОБАВЛЯТЬ: он сломан целиком (OPEN-ITEMS #18,
  # eslint ^9 vs @typescript-eslint ^7 vs eslint-config-next 15.5.15) — это
  # отдельная работа. Его частичную замену держит шаг «hooks rule gate» ниже.
  #
  # `relayer/e2e.mjs` СЮДА НЕ ДОБАВЛЯТЬ НИКОГДА: он ходит в живую Base Sepolia
  # и тратит реальный тестовый USDC — в CI это трата денег на каждый пуш.
  web:
    name: frontend & relayer
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Как в обоих Dockerfile (node:22-alpine) — CI проверяет ту же
          # мажорную версию, на которой всё в итоге и крутится.
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            relayer/package-lock.json
            frontend/package-lock.json

      # ПОРЯДОК ШАГОВ ЗНАЧИМ. Релеерные зависимости нужны не только релееру:
      # у фронта нет своего тест-раннера, и `npm test` во frontend/ запускает
      # `node ../relayer/node_modules/vitest/vitest.mjs run` (почему именно так
      # — шапка frontend/vitest.config.mjs). Переставишь эти два шага местами
      # или выкинешь установку релеера — фронтовые тесты упадут на
      # «Cannot find module .../vitest.mjs», а не на настоящей ошибке.
      - name: Install relayer deps
        working-directory: relayer
        run: npm ci

      # --legacy-peer-deps — ровно как в frontend/Dockerfile. Без флага `npm ci`
      # падает на ERESOLVE: eslint ^9 против peer eslint ^8.56 у
      # @typescript-eslint/eslint-plugin ^7. Это тот же конфликт, из-за которого
      # сломан `npm run lint` (OPEN-ITEMS #18).
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Relayer tests
        working-directory: relayer
        run: npm test

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      # Гейт правила хуков — единственная часть линта, которая в этом репозитории
      # вообще работает. Конфиг грузит только eslint-plugin-react-hooks:
      # rules-of-hooks = error, exhaustive-deps = warn. Значит шаг краснеет на
      # настоящем нарушении порядка хуков (хук после раннего return, хук в
      # условии), а не на накопленном шуме зависимостей.
      - name: Hooks rule gate
        working-directory: frontend
        run: node node_modules/eslint/bin/eslint.js -c eslint.hooks.mjs "src/**/*.{ts,tsx,js,jsx}"

      # `next build` — единственное, что ловит требование Suspense вокруг
      # useSearchParams(): оно проверяется постранично, при пререндере, и не
      # видно ни в `next dev`, ни в tsc. В этом проекте оно уже роняло ветку.
      #
      # Адреса — фиксированные заглушки, теми же значениями, что в
      # frontend/vitest.config.mjs. Они обязаны быть: config/contracts.ts
      # намеренно бросает НА ЗАГРУЗКЕ МОДУЛЯ, если их нет (без хардкод-фолбэка —
      # однажды устаревший literal молча перебил исправленный адрес). Сборке
      # при этом всё равно, какие именно; настоящие адреса приезжают из secrets
      # в job `build` ниже, который и собирает образ для выкатки.
      - name: Frontend build
        working-directory: frontend
        env:
          NEXT_PUBLIC_DIAMOND_ADDRESS: '0x0000000000000000000000000000000000000d1a'
          NEXT_PUBLIC_FORWARDER_ADDRESS: '0x000000000000000000000000000000000000f0Fd'
          NEXT_PUBLIC_USDC_ADDRESS: '0x0000000000000000000000000000000000005dc0'
        run: npm run build

      # Полный проход tsc по программе tsconfig — шире, чем типы, до которых
      # дотягивается сборка. После build намеренно: к этому моменту существует
      # .next/types, который tsconfig включает в программу.
      # Только `npm run type-check`; голый `npx tsc` в этом репозитории врёт
      # (node_modules/.bin пуст на exFAT — там он возвращает 0, ничего не проверив).
      - name: Frontend type-check
        working-directory: frontend
        run: npm run type-check

  # Публикация образов в ghcr — НЕ на pull_request, и это не осторожность, а
  # арифметика: у PR из форка `GITHUB_TOKEN` только на чтение, `packages: write`
  # ему не выдаётся ни при каких настройках, и шаг «Login to GHCR» упал бы у
  # каждого стороннего участника. Он увидел бы красный CI за то, чего не делал,
  # а образ из непроверенной ветки в реестр не попал бы всё равно.
  # Триггер именно `pull_request`, а не `pull_request_target`: код форка
  # исполняется без доступа к секретам репозитория. Менять на `_target` нельзя.
  build:
    needs: [contracts, web]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push relayer
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./relayer
          push: true
          tags: ghcr.io/hexseal/relayer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/hexseal/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_RELAYER_URL=${{ secrets.NEXT_PUBLIC_RELAYER_URL }}
            NEXT_PUBLIC_DIAMOND_ADDRESS=${{ secrets.NEXT_PUBLIC_DIAMOND_ADDRESS }}
            NEXT_PUBLIC_FORWARDER_ADDRESS=${{ secrets.NEXT_PUBLIC_FORWARDER_ADDRESS }}
            NEXT_PUBLIC_USDC_ADDRESS=${{ secrets.NEXT_PUBLIC_USDC_ADDRESS }}
            NEXT_PUBLIC_JOB_RECEIPT_ADDRESS=${{ secrets.NEXT_PUBLIC_JOB_RECEIPT_ADDRESS }}
            NEXT_PUBLIC_CHAIN_ID=${{ secrets.NEXT_PUBLIC_CHAIN_ID }}
            NEXT_PUBLIC_BASE_SEPOLIA_RPC_URL=${{ secrets.NEXT_PUBLIC_BASE_SEPOLIA_RPC_URL }}
            NEXT_PUBLIC_RPC_URL=${{ secrets.NEXT_PUBLIC_RPC_URL }}
            NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            NEXT_PUBLIC_IPFS_GATEWAY=${{ secrets.NEXT_PUBLIC_IPFS_GATEWAY }}
            SUBGRAPH_URL=${{ secrets.SUBGRAPH_URL }}

  deploy:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u hexseal --password-stdin
            cd /opt/hexseal/app
            docker compose pull frontend relayer
            docker compose up -d frontend relayer
            docker image prune -f
