services:
  relayer:
    image: ghcr.io/hexseal/relayer:latest
    build: ./relayer
    restart: unless-stopped
    env_file: .env.vps
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - relayer_storage:/app/storage

  frontend:
    image: ghcr.io/hexseal/frontend:latest
    environment:
      PORT: "3000"
      RELAYER_INTERNAL_URL: "http://relayer:3001"
      # DRPC_URL is deliberately NOT listed here. `environment:` overrides `env_file:`,
      # and ${DRPC_URL} interpolates from the shell / ./.env — never from .env.vps. With
      # the value living only in .env.vps this line resolved to an empty string and
      # silently shadowed it, disabling the private keyed RPC and dumping every call
      # onto rate-limited public endpoints (which is what makes /api/rpc return 502).
      # `env_file: .env.vps` below already injects it into the container at runtime.
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_RELAYER_URL: ${NEXT_PUBLIC_RELAYER_URL}
        NEXT_PUBLIC_DIAMOND_ADDRESS: ${NEXT_PUBLIC_DIAMOND_ADDRESS}
        NEXT_PUBLIC_FORWARDER_ADDRESS: ${NEXT_PUBLIC_FORWARDER_ADDRESS}
        NEXT_PUBLIC_USDC_ADDRESS: ${NEXT_PUBLIC_USDC_ADDRESS}
        NEXT_PUBLIC_JOB_RECEIPT_ADDRESS: ${NEXT_PUBLIC_JOB_RECEIPT_ADDRESS}
        NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID}
        NEXT_PUBLIC_BASE_SEPOLIA_RPC_URL: ${NEXT_PUBLIC_BASE_SEPOLIA_RPC_URL}
        NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
        NEXT_PUBLIC_IPFS_GATEWAY: ${NEXT_PUBLIC_IPFS_GATEWAY}
        SUBGRAPH_URL: ${SUBGRAPH_URL}
    restart: unless-stopped
    env_file: .env.vps
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - relayer

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    depends_on:
      - frontend
      - relayer

volumes:
  relayer_storage: