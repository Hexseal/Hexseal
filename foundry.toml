[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true

# test/DeployFullSelectors.t.sol reads compiled ABI artifacts (out/<Facet>.sol/<Facet>.json)
# to derive ground-truth selectors for the DeployFull.s.sol drift gate — read-only,
# scoped to the build output directory only.
fs_permissions = [{ access = "read", path = "./out" }]

# test/Boards.t.sol grew past a solc via-ir legacy-assembly limit (Task 5 added
# five more ServiceBoard fee tests to an already-large contract): the default
# optimizer_runs=200 makes solc crash with an internal "Tag too large for
# reserved space" error.
#
# solc settings are per compilation unit, not per file — this restriction
# applies to test/Boards.t.sol's whole import closure, so every src/ contract
# it pulls in (Agreement, FactoryFacet, ServiceBoardFacet, ...) gets a SECOND
# artifact compiled at optimizer_runs=1 (out/<File>.sol/<Contract>.boards-test-lowopt.json),
# alongside its normal default-profile one. Only test/Boards.t.sol itself is
# now compiled exclusively at runs=1 — every other file (src/ under any other
# test/script entry point, and every other test file) still gets its default
# runs=200 artifact, and that's the one forge script/forge create actually
# link and deploy — so deployed bytecode is unaffected. But gas numbers
# printed by test/Boards.t.sol no longer match production bytecode for the
# contracts it imports, and an EIP-170 size overrun in one of those contracts
# would not show up when compiled only through this file.
#
# Temporary: Task 9 splits test/Boards.t.sol into a shared fixture plus two
# test-contract files, at which point neither contract crosses the solc
# limit and this whole workaround goes away.
additional_compiler_profiles = [
  { name = "boards-test-lowopt", via_ir = true, optimizer = true, optimizer_runs = 1 },
]
compilation_restrictions = [
  { paths = "test/Boards.t.sol", optimizer_runs = 1 },
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
