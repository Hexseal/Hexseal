[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true

# test/DeployFullSelectors.t.sol reads compiled ABI artifacts (out/<Facet>.sol/<Facet>.json)
# to derive ground-truth selectors for the DeployFull.s.sol drift gate — read-only,
# scoped to the build output directory only.
fs_permissions = [{ access = "read", path = "./out" }]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
