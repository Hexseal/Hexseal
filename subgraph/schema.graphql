type Job @entity {
  id: ID!
  client: Bytes!
  title: String!
  description: String!
  amount: BigInt!
  deadlineDays: BigInt!
  terms: String!
  region: Int!
  status: String!
  executor: Bytes
  agreement: Bytes
  applicants: [Bytes!]!
  createdAt: BigInt!
  updatedAt: BigInt!
}

type Service @entity {
  id: ID!
  executor: Bytes!
  title: String!
  description: String!
  price: BigInt!
  deadlineDays: BigInt!
  region: Int!
  status: String!
  hiresCount: BigInt!
  createdAt: BigInt!
  updatedAt: BigInt!
}

type ServiceRequest @entity {
  id: ID!
  serviceId: String!
  client: Bytes!
  amount: BigInt!
  status: String!
  createdAt: BigInt!
}

type Agreement @entity {
  id: ID!
  client: Bytes!
  executor: Bytes!
  amount: BigInt!
  region: Int!
  fee: BigInt!
  status: Int!
  createdAt: BigInt!
  updatedAt: BigInt!
  resolvedAt: BigInt
  jobId: String
  serviceId: String
  requestId: String
  clientWon: Boolean

  # Заполняются только когда спор закрылся дележом — за него никто не взялся, и
  # таймаут разделил котёл. Без них дележ в сабграфе неотличим от полного
  # возврата: оба ложатся в status = 6, а clientWon остаётся пустым, потому что
  # не выиграл никто. Суммы разные при нечётном котле, поэтому храним обе, а не
  # одну половину.
  splitToClient: BigInt
  splitToExecutor: BigInt
}
