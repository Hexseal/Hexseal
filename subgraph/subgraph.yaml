specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Diamond
    network: base-sepolia
    source:
      address: "0x760F07367888C62f7c2Dfb619A5e534132855ce5"
      abi: Diamond
      startBlock: 44613049
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Job
        - Service
        - ServiceRequest
        - Agreement
        - FeeCollection
        - Arbiter
        - ArbiterSeating
        - ArbiterResignation
        - ArbiterDemotion
        - ArbiterRemoval
        - ArbiterSuspension
        - ArbiterSuspensionLift
        - RemovalProposal
        - RemovalAnswer
        - ChainAccusation
        - RemovalReason
        - RemovalReply
        - Verdict
        - VerdictOverturn
        - ArbiterTimeout
      abis:
        - name: Diamond
          file: ./abis/Diamond.json
      eventHandlers:
        - event: JobPosted(indexed uint256,indexed address,uint256,uint8,string,string,uint256,string)
          handler: handleJobPosted
        - event: JobEdited(indexed uint256,indexed address,string,string,uint256,string,uint8)
          handler: handleJobEdited
        - event: JobApplied(indexed uint256,indexed address)
          handler: handleJobApplied
        - event: JobWithdrawn(indexed uint256,indexed address)
          handler: handleJobWithdrawn
        - event: JobAccepted(indexed uint256,indexed address,indexed address,address)
          handler: handleJobAccepted
        - event: JobCancelled(indexed uint256,indexed address,uint256)
          handler: handleJobCancelled
        - event: ServicePosted(indexed uint256,indexed address,uint256,uint8,string,string,uint256)
          handler: handleServicePosted
        - event: ServiceEdited(indexed uint256,indexed address,string,string,uint256,uint256,uint8)
          handler: handleServiceEdited
        - event: ServicePaused(indexed uint256)
          handler: handleServicePaused
        - event: ServiceUnpaused(indexed uint256)
          handler: handleServiceUnpaused
        - event: ServiceRemoved(indexed uint256,indexed address)
          handler: handleServiceRemoved
        - event: ServiceRequested(indexed uint256,indexed uint256,indexed address,uint256)
          handler: handleServiceRequested
        - event: RequestAccepted(indexed uint256,indexed address,indexed address,address)
          handler: handleRequestAccepted
        - event: RequestRejected(indexed uint256,indexed address,indexed address)
          handler: handleRequestRejected
        - event: RequestCancelled(indexed uint256,indexed address)
          handler: handleRequestCancelled
        - event: AgreementDeployed(indexed address,indexed address,indexed address,uint256,uint8,uint256)
          handler: handleAgreementDeployed
        - event: FeeCollected(indexed uint256,indexed address,indexed uint8,uint256)
          handler: handleFeeCollected

        # ── Arbiter accountability ───────────────────────────────────────────
        # Handlers live in ./src/arbiter.ts and reach the manifest through a
        # re-export at the bottom of ./src/diamond.ts.
        #
        # ⚠️ A SECOND DATA SOURCE WOULD BE THE CLEANER SHAPE AND IS NOT ALLOWED
        # HERE. One data source takes exactly one mapping file, so keeping the
        # arbiter code out of diamond.ts costs either a second data source or a
        # re-export. The second data source was written, and it broke two tests
        # in a neighbour: frontend/src/lib/arbiterTurn.test.ts reads THIS file
        # to check its own copy of the diamond's deploy block, and refuses to
        # guess when it finds two `startBlock:` lines — deliberately, with a
        # test of its own asserting the refusal. It is right to refuse: with two
        # data sources nothing in the text says which block belongs to the
        # diamond. So the manifest keeps one data source, one address and one
        # start block, and the re-export pays for it.
        #
        # ⚠️ THE ADDRESS ABOVE IS THE DIAMOND, NOT A FACET, and it must stay
        # that way. Facets are replaced by every cut — ArbiterRegistryFacet has
        # been swapped three times since July — while the proxy address never
        # changes. Point this at a facet and indexing goes quiet at the next
        # upgrade, with no error anywhere.
        #
        # ⚠️ NONE OF THESE EVENTS EXIST ON CHAIN YET: the cut that mounts
        # ArbiterAccountabilityFacet and the reworked ArbiterRegistryFacet has
        # not been made. Until it is, every handler below is simply never
        # called, which is the expected state and not a fault. The ABI comes
        # from the branch.
        #
        # ⚠️ TWO SIGNATURES CHANGED UNDER EVENTS THAT KEPT THEIR NAME.
        # ArbiterDemoted used to be ArbiterDemoted(address) and now has four
        # fields, and the old ArbiterRemoved(address) went with the bare
        # removeArbiter that emitted it. A log is matched by the hash of its
        # full signature, so anything the live diamond emitted under the old
        # shapes before the cut is invisible here.
        - event: ArbiterSeated(indexed address,indexed address,bool)
          handler: handleArbiterSeated
        - event: ArbiterResigned(indexed address,uint256)
          handler: handleArbiterResigned
        - event: ArbiterDemoted(indexed address,indexed address,indexed uint8,address)
          handler: handleArbiterDemoted
        - event: ArbiterSuspended(indexed address,indexed address,uint256)
          handler: handleArbiterSuspended
        - event: ArbiterSuspensionLifted(indexed address,indexed address)
          handler: handleArbiterSuspensionLifted
        - event: ArbiterRemovedForCause(indexed address,indexed address,indexed uint8,bool,bytes32,uint256)
          handler: handleArbiterRemovedForCause
        - event: RemovalProposed(indexed address,indexed address,indexed uint8,bytes32,uint256)
          handler: handleRemovalProposed
        - event: RemovalProposalWithdrawn(indexed address,indexed address)
          handler: handleRemovalProposalWithdrawn
        - event: RemovalProposalConsumed(indexed address,indexed uint8,indexed address,bytes32,uint256)
          handler: handleRemovalProposalConsumed
        - event: RemovalAnswered(indexed address,bytes32)
          handler: handleRemovalAnswered

        # ── The words on both sides ──────────────────────────────────────────
        # The half of the accountability work that the feed was missing
        # entirely: an accusation nobody had to explain, answered by a hash.
        # Both events carry a string and are emitted only when there is one to
        # carry — an empty reason would erase the difference between "explained
        # himself" and "said nothing", and that difference is what the whole
        # design rests on.
        - event: RemovalReasonGiven(indexed address,indexed address,indexed uint8,string)
          handler: handleRemovalReasonGiven
        - event: RemovalReplyGiven(indexed address,string)
          handler: handleRemovalReplyGiven

        # ── The chain accusing in its own name ───────────────────────────────
        # Until these two were indexed, an arbiter removed on the third
        # judicial mistake read in the feed as a seat taken away with no
        # accusation, no pause and no right of reply: handleArbiterDemoted
        # closed a proposal that had never appeared.
        - event: RemovalProposedByChain(indexed address,uint8,indexed address,uint256)
          handler: handleRemovalProposedByChain
        - event: ChainAccusationCleared(indexed address,indexed address)
          handler: handleChainAccusationCleared

        # ── The evidence under that accusation ───────────────────────────────
        # Owner decision 15a (20 August 2026): the accused must see EVERY
        # dispute the accusation stands on, not the last of them.
        # RemovalProposedByChain carries one and the accusation stands on
        # three; the rest are recovered from these four.
        #
        # ⚠️ ALL FOUR, NOT JUST VerdictOverturned, and the other three are not
        # padding. A streak is "mistakes in an unbroken row", so the RESETS
        # have to be visible too — and a reset is "VerdictFinalized on a
        # verdict that was not overturned", a fact no single log states.
        # VerdictSubmitted is what a finalization is held against;
        # AppealResolved is a judicial mistake that VerdictOverturned never
        # mentions, since the appeal path emits no overturn log at all.
        - event: VerdictSubmitted(indexed address,indexed address,bool)
          handler: handleVerdictSubmitted
        - event: VerdictOverturned(indexed address,indexed address,bool)
          handler: handleVerdictOverturned
        - event: VerdictFinalized(indexed address,indexed address,bool)
          handler: handleVerdictFinalized
        - event: AppealResolved(indexed address,indexed address,bool)
          handler: handleAppealResolved
        # ⚠️ THE ONE EVENT HERE THAT DID NOT EXIST BEFORE THIS FEED ASKED FOR
        # IT (21 August 2026). A judicial mistake booked on the timeout left no
        # log naming the arbiter at all — notifyArbiterTimeout emitted nothing,
        # and Agreement's own ArbiterTimedOut names the CLIENT — so a mistake
        # run containing one came out a dispute short and the accused was shown
        # two of the three deals his removal stood on. Reading could not fix
        # that; the event was added to the contract instead.
        - event: ArbiterTimeoutRecorded(indexed address,indexed address)
          handler: handleArbiterTimeoutRecorded
      file: ./src/diamond.ts
templates:
  - kind: ethereum
    name: AgreementContract
    network: base-sepolia
    source:
      abi: Agreement
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Agreement
      abis:
        - name: Agreement
          file: ./abis/Agreement.json
      eventHandlers:
        - event: Funded(indexed address,uint256)
          handler: handleFunded
        - event: Activated(indexed address)
          handler: handleActivated
        - event: Released(indexed address,indexed address,uint256)
          handler: handleReleased
        - event: AutoApproved(indexed address,uint256)
          handler: handleAutoApproved
        - event: DisputeRaised(indexed address)
          handler: handleDisputeRaised
        - event: DisputeResolved(indexed address,bool,uint256)
          handler: handleDisputeResolved
        - event: TimedOut(indexed address,uint256)
          handler: handleTimedOut
        - event: ArbiterTimedOut(indexed address,uint256)
          handler: handleArbiterTimedOut
        # Дележ котла пополам, когда за спор никто не взялся. ArbiterTimedOut в
        # этом случае намеренно НЕ эмитится — наказывать некого, — поэтому без
        # своего хендлера сделка оставалась бы в статусе «спор» навсегда, хотя
        # на цепи она финализирована и пуста.
        - event: DisputeSplitNoVerdict(uint256,uint256)
          handler: handleDisputeSplitNoVerdict
        - event: DisputeResponded(indexed address)
          handler: handleDisputeResponded
        # Таймаут при незаклеймленном споре, когда одна сторона молчала: ей
        # четверть котла. ArbiterTimedOut здесь, как и при дележе пополам, не
        # эмитится — наказывать некого, — поэтому без своего хендлера сделка
        # осталась бы в статусе «спор» навсегда.
        - event: DisputeUnanswered(indexed address,uint256,uint256)
          handler: handleDisputeUnanswered
      file: ./src/agreement.ts
