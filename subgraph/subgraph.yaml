specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Diamond
    network: base-sepolia
    source:
      address: "0x760F07367888C62f7c2Dfb619A5e534132855ce5"
      abi: Diamond
      startBlock: 44613049
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Job
        - Service
        - ServiceRequest
        - Agreement
        - FeeCollection
      abis:
        - name: Diamond
          file: ./abis/Diamond.json
      eventHandlers:
        - event: JobPosted(indexed uint256,indexed address,uint256,uint8,string,string,uint256,string)
          handler: handleJobPosted
        - event: JobEdited(indexed uint256,indexed address,string,string,uint256,string,uint8)
          handler: handleJobEdited
        - event: JobApplied(indexed uint256,indexed address)
          handler: handleJobApplied
        - event: JobWithdrawn(indexed uint256,indexed address)
          handler: handleJobWithdrawn
        - event: JobAccepted(indexed uint256,indexed address,indexed address,address)
          handler: handleJobAccepted
        - event: JobCancelled(indexed uint256,indexed address,uint256)
          handler: handleJobCancelled
        - event: ServicePosted(indexed uint256,indexed address,uint256,uint8,string,string,uint256)
          handler: handleServicePosted
        - event: ServiceEdited(indexed uint256,indexed address,string,string,uint256,uint256,uint8)
          handler: handleServiceEdited
        - event: ServicePaused(indexed uint256)
          handler: handleServicePaused
        - event: ServiceUnpaused(indexed uint256)
          handler: handleServiceUnpaused
        - event: ServiceRemoved(indexed uint256,indexed address)
          handler: handleServiceRemoved
        - event: ServiceRequested(indexed uint256,indexed uint256,indexed address,uint256)
          handler: handleServiceRequested
        - event: RequestAccepted(indexed uint256,indexed address,indexed address,address)
          handler: handleRequestAccepted
        - event: RequestRejected(indexed uint256,indexed address,indexed address)
          handler: handleRequestRejected
        - event: RequestCancelled(indexed uint256,indexed address)
          handler: handleRequestCancelled
        - event: AgreementDeployed(indexed address,indexed address,indexed address,uint256,uint8,uint256)
          handler: handleAgreementDeployed
        - event: FeeCollected(indexed uint256,indexed address,indexed uint8,uint256)
          handler: handleFeeCollected
      file: ./src/diamond.ts

  # Arbiter accountability. A SECOND data source on the SAME address, not extra
  # handlers on the one above, for three reasons: a data source takes exactly
  # one mapping file and diamond.ts is about the boards, the entity list stays
  # readable, and startBlock can later be moved up to the cut block on its own
  # without touching the board indexing. The two event sets are disjoint, so
  # nothing is processed twice.
  #
  # ⚠️ THE ADDRESS IS THE DIAMOND, NOT THE FACET, and it must stay that way.
  # Facets are replaced by every cut — ArbiterRegistryFacet has been swapped
  # three times since July — while the proxy address never changes. Point this
  # at a facet and indexing goes silent at the next upgrade, with no error.
  #
  # ⚠️ NONE OF THESE EVENTS EXIST ON CHAIN YET: the cut that mounts
  # ArbiterAccountabilityFacet and the reworked ArbiterRegistryFacet has not
  # been made. Until it is, every handler below is simply never called, which
  # is the expected state and not a fault. The ABI is taken from the branch.
  #
  # ⚠️ TWO SIGNATURES CHANGED UNDER EVENTS THAT KEEP THEIR NAME. ArbiterDemoted
  # used to be ArbiterDemoted(address) and is now four fields, and the old
  # ArbiterRemoved(address) is gone with the bare removeArbiter that emitted it.
  # A log is matched by the hash of its full signature, so anything the live
  # diamond emitted under the old shapes before the cut is invisible here.
  # Whether that history is empty is a question for the chain, not for this
  # file; see docs and the task report.
  - kind: ethereum
    name: DiamondArbiter
    network: base-sepolia
    source:
      address: "0x760F07367888C62f7c2Dfb619A5e534132855ce5"
      abi: Diamond
      startBlock: 44613049
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Arbiter
        - ArbiterSeating
        - ArbiterResignation
        - ArbiterDemotion
        - ArbiterRemoval
        - ArbiterSuspension
        - ArbiterSuspensionLift
        - RemovalProposal
        - RemovalAnswer
      abis:
        - name: Diamond
          file: ./abis/Diamond.json
      eventHandlers:
        - event: ArbiterSeated(indexed address,indexed address,bool)
          handler: handleArbiterSeated
        - event: ArbiterResigned(indexed address,uint256)
          handler: handleArbiterResigned
        - event: ArbiterDemoted(indexed address,indexed address,indexed uint8,address)
          handler: handleArbiterDemoted
        - event: ArbiterSuspended(indexed address,indexed address,uint256)
          handler: handleArbiterSuspended
        - event: ArbiterSuspensionLifted(indexed address,indexed address)
          handler: handleArbiterSuspensionLifted
        - event: ArbiterRemovedForCause(indexed address,indexed address,indexed uint8,bool,bytes32,uint256)
          handler: handleArbiterRemovedForCause
        - event: RemovalProposed(indexed address,indexed address,indexed uint8,bytes32,uint256)
          handler: handleRemovalProposed
        - event: RemovalProposalWithdrawn(indexed address,indexed address)
          handler: handleRemovalProposalWithdrawn
        - event: RemovalProposalConsumed(indexed address,indexed uint8,indexed address,bytes32,uint256)
          handler: handleRemovalProposalConsumed
        - event: RemovalAnswered(indexed address,bytes32)
          handler: handleRemovalAnswered
      file: ./src/arbiter.ts
templates:
  - kind: ethereum
    name: AgreementContract
    network: base-sepolia
    source:
      abi: Agreement
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Agreement
      abis:
        - name: Agreement
          file: ./abis/Agreement.json
      eventHandlers:
        - event: Funded(indexed address,uint256)
          handler: handleFunded
        - event: Activated(indexed address)
          handler: handleActivated
        - event: Released(indexed address,indexed address,uint256)
          handler: handleReleased
        - event: AutoApproved(indexed address,uint256)
          handler: handleAutoApproved
        - event: DisputeRaised(indexed address)
          handler: handleDisputeRaised
        - event: DisputeResolved(indexed address,bool,uint256)
          handler: handleDisputeResolved
        - event: TimedOut(indexed address,uint256)
          handler: handleTimedOut
        - event: ArbiterTimedOut(indexed address,uint256)
          handler: handleArbiterTimedOut
        # Дележ котла пополам, когда за спор никто не взялся. ArbiterTimedOut в
        # этом случае намеренно НЕ эмитится — наказывать некого, — поэтому без
        # своего хендлера сделка оставалась бы в статусе «спор» навсегда, хотя
        # на цепи она финализирована и пуста.
        - event: DisputeSplitNoVerdict(uint256,uint256)
          handler: handleDisputeSplitNoVerdict
        - event: DisputeResponded(indexed address)
          handler: handleDisputeResponded
        # Таймаут при незаклеймленном споре, когда одна сторона молчала: ей
        # четверть котла. ArbiterTimedOut здесь, как и при дележе пополам, не
        # эмитится — наказывать некого, — поэтому без своего хендлера сделка
        # осталась бы в статусе «спор» навсегда.
        - event: DisputeUnanswered(indexed address,uint256,uint256)
          handler: handleDisputeUnanswered
      file: ./src/agreement.ts
